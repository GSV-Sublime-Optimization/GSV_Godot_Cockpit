<meta charset="utf-8">
<title>Chorus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400;1,6..96,500&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-height night sky (canvas) with the fleet as four singing stars; the latest thought is
   engraved bottom-centre like a score marking; a memory river of past thoughts runs along the foot.
   One committed dark world (an observatory at night), so no light theme by design. */
:root {
  color-scheme: dark;
  --sky: #070b16;          /* deep observatory blue, not black */
  --sky-2: #0d1426;
  --ink: #e9e4d6;          /* starlight parchment */
  --ink-dim: #9aa3b8;
  --hair: #26304a;
  --msi: #e2b25a;          /* brass: the workshop */
  --i3: #ec7348;           /* ember: the engine room */
  --l9: #63cbdb;           /* glacier: the drone */
  --xanadu: #b9a2f0;       /* lilac: the librarian */
  --tranquillo: #5fc4b0;   /* routine */
  --attento: #e8b34a;      /* notable */
  --agitato: #ef4f5a;      /* alarm */
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--f-body);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.ui {
  position: fixed; inset: 0; pointer-events: none; display: grid;
  grid-template-rows: auto 1fr auto auto; grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.mark { display: grid; gap: 2px; }
.mark h1 {
  margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3.2vw, 34px);
  letter-spacing: 0.32em; text-transform: uppercase; line-height: 1;
}
.mark p { margin: 0; color: var(--ink-dim); font-size: 13px; letter-spacing: 0.04em; }
.status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.chip {
  font-family: var(--f-data); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 9px; border: 1px solid var(--hair); border-radius: 999px; color: var(--ink-dim);
  background: color-mix(in srgb, var(--sky-2) 80%, transparent);
}
.chip.live { color: var(--tranquillo); border-color: color-mix(in srgb, var(--tranquillo) 45%, var(--hair)); }
.chip.rehearsal { color: var(--attento); border-color: color-mix(in srgb, var(--attento) 50%, var(--hair)); }
.controls { display: flex; gap: 8px; pointer-events: auto; }
button {
  font: 600 12px var(--f-body); letter-spacing: 0.06em; color: var(--ink); cursor: pointer;
  background: color-mix(in srgb, var(--sky-2) 85%, transparent); border: 1px solid var(--hair);
  border-radius: 999px; padding: 7px 13px;
}
button:hover { border-color: var(--ink-dim); }
button:focus-visible { outline: 2px solid var(--l9); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--attento); color: var(--attento); }

.thought { pointer-events: auto; user-select: text; justify-self: center; text-align: center; max-width: min(62ch, 100%); display: grid; gap: 10px; padding-bottom: 14px; }
.marking {
  font-family: var(--f-display); font-style: italic; font-size: clamp(15px, 1.8vw, 19px);
  letter-spacing: 0.06em; color: var(--lvl, var(--tranquillo));
}
.marking::before, .marking::after { content: ""; display: inline-block; width: 28px; height: 1px; background: currentColor; opacity: 0.5; vertical-align: middle; margin: 0 12px; }
.line {
  margin: 0; font-family: var(--f-display); font-weight: 400; font-style: italic;
  font-size: clamp(22px, 3.4vw, 40px); line-height: 1.18; text-wrap: balance; color: var(--ink);
  text-shadow: 0 2px 24px rgba(0,0,0,0.6);
}
.meta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
.reason {
  font-family: var(--f-data); font-size: 12px; padding: 3px 9px; border-radius: 4px;
  border: 1px solid color-mix(in srgb, var(--lvl, var(--tranquillo)) 40%, var(--hair));
  color: var(--ink); background: color-mix(in srgb, var(--sky) 70%, transparent);
}
.who { font-family: var(--f-data); font-size: 12px; color: var(--ink-dim); }
.who b { color: var(--ink); font-weight: 600; }

/* What needs you: the work list. Ranked by severity; each item says what, since when, why, your move, who. */
.needs {
  pointer-events: auto; align-self: start; justify-self: start; margin-top: 14px;
  width: min(400px, 100%); max-height: calc(100% - 14px); overflow: auto;
  background: color-mix(in srgb, var(--sky) 82%, transparent); border: 1px solid var(--hair); border-radius: 10px;
  backdrop-filter: blur(6px);
}
.needs summary {
  cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline;
  padding: 12px 14px; position: sticky; top: 0; background: color-mix(in srgb, var(--sky) 92%, transparent);
}
.needs summary::-webkit-details-marker { display: none; }
.needs summary:focus-visible { outline: 2px solid var(--l9); outline-offset: -2px; }
.needs-title { font-family: var(--f-display); font-style: italic; font-size: 19px; }
.needs-count { font-family: var(--f-data); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.needs-list { list-style: none; margin: 0; padding: 0 10px 10px; display: grid; gap: 8px; }
.need { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--sky-2) 85%, transparent); }
.need-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.need-what { font-weight: 700; font-size: 14px; line-height: 1.3; }
.sev { font-family: var(--f-display); font-style: italic; font-size: 13px; color: var(--c); white-space: nowrap; }
.need-meta { font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.need-why { font-size: 13px; color: var(--ink-dim); line-height: 1.4; }
.move { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.move code {
  flex: 1 1 100%; font-family: var(--f-data); font-size: 12px; line-height: 1.45; color: var(--ink);
  background: var(--sky); border: 1px solid var(--hair); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere;
}
.move button { padding: 5px 9px; font-size: 11px; }
.need a { color: var(--l9); }
.need ul { margin: 0; padding-left: 16px; font-size: 12px; display: grid; gap: 2px; }
.clear { padding: 4px 14px 14px; color: var(--tranquillo); font-family: var(--f-display); font-style: italic; }
@media (max-width: 720px) { .needs { max-height: 34vh; margin-top: 10px; } }
/* Conversation: the shared cockpit channel (xanadu:~/steward/cockpit/channel.jsonl), same as HOLOMIND's */
.talk { border-top: 1px solid var(--hair); padding: 10px 10px 12px; display: grid; gap: 8px; }
.talk-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.talk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 210px; overflow: auto; }
.msg { font-size: 13px; line-height: 1.4; padding: 6px 8px; border-radius: 6px; background: color-mix(in srgb, var(--sky-2) 80%, transparent); }
.msg .from { font-family: var(--f-data); font-size: 11px; color: var(--c, var(--ink-dim)); }
.msg .from small { color: var(--ink-dim); }
.msg.mind .body { font-family: var(--f-display); font-style: italic; }
.talk-form { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
.talk-form select, .talk-form input {
  font: 13px var(--f-body); color: var(--ink); background: var(--sky); border: 1px solid var(--hair);
  border-radius: 6px; padding: 6px 8px; min-width: 0;
}
.talk-form select:focus-visible, .talk-form input:focus-visible { outline: 2px solid var(--l9); outline-offset: 1px; }
.talk-note { margin: 0; font-size: 12px; color: var(--ink-dim); padding: 0 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.need .ask { justify-self: start; font-size: 11px; padding: 4px 10px; color: var(--msi); border-color: color-mix(in srgb, var(--msi) 40%, var(--hair)); }
/* MSI Claude's live steps, under the wordmark */
.claude-tick {
  position: fixed; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 66px); right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 3px; justify-items: end; pointer-events: none; font-family: var(--f-data); font-size: 11px; color: var(--ink-dim);
  max-width: min(46ch, 60vw);
}
.claude-tick b { color: var(--msi); font-weight: 600; }
.claude-tick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (max-width: 720px) { .claude-tick { display: none; } }
.river { pointer-events: auto; display: grid; gap: 6px; }
.river-head { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.river-track {
  position: relative; height: 34px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--sky-2) 90%, transparent) 12%, color-mix(in srgb, var(--sky-2) 90%, transparent) 88%, transparent);
}
.drop {
  position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
  border: 0; padding: 0; background: var(--c); box-shadow: 0 0 10px var(--c); cursor: pointer;
}
.drop.synthetic { background: transparent; border: 1.5px dashed var(--c); box-shadow: none; }
.drop[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); padding-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.river-head { flex-wrap: wrap; gap: 4px 12px; }
.controls { flex-wrap: wrap; }
@media (max-width: 520px) {
  .mark p { display: none; }
  .top { flex-direction: column; align-items: stretch; gap: 8px; }
  .status { justify-content: flex-start; }
  .chip { font-size: 10px; letter-spacing: 0.04em; }
  .controls button { padding: 6px 10px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .line { text-shadow: none; } }
/* rig card: click a star to open what that rig knows about itself */
.rig-card {
  position: fixed; z-index: 5; pointer-events: auto; width: min(340px, calc(100% - 32px)); max-height: 70vh; overflow: auto;
  background: color-mix(in srgb, var(--sky) 90%, transparent); border: 1px solid var(--c, var(--hair)); border-radius: 10px;
  padding: 12px 14px; display: grid; gap: 8px; font-size: 13px; user-select: text;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.rig-card h3 { margin: 0; font: italic 500 22px var(--f-display); color: var(--c); display: flex; justify-content: space-between; align-items: baseline; }
.rig-card h3 small { font: 11px var(--f-data); color: var(--ink-dim); font-style: normal; }
.rig-card .row { font: 12px/1.45 var(--f-data); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.rig-card .row b { color: var(--ink); font-weight: 600; }
.rig-card .bad { color: var(--agitato); }
.rig-card .said { font-style: italic; color: var(--ink); }
.rig-card .acts { display: flex; gap: 8px; }
canvas#sky.pointing { cursor: pointer; }
.msg .state { font: 10px var(--f-data); color: var(--tranquillo); letter-spacing: .04em; }
</style>

<canvas id="sky" aria-label="The fleet drawn as four stars: MSI, i3, L9 and xanadu, with their minds' thoughts as comets"></canvas>
<div class="ui">
  <header class="top">

      <div class="controls">

        <button id="rehearse" aria-pressed="false" title="Play labelled demo thoughts through every state">Rehearse</button>
        <button id="copy-brief" title="Copy every layer as text: needs and next moves first (C)">Copy brief</button>

  </details>
  <div class="claude-tick" id="claude-tick" aria-live="off"></div>
  <aside class="rig-card" id="rig-card" hidden aria-live="polite"></aside>

      <span style="--c: var(--xanadu)">xanadu · librarian · B</span>
    </div>
  </footer>
</div>

<script>
"use strict";
// ---------- data: the shared bakeoff fixture (real, frozen 2026-11-08 06:48 UTC) ----------
const FIXTURE_NOW = Date.parse("2026-11-08T06:48:00Z");
const FIXTURE = {
  events: [
    {at:"2026-11-08T05:35:16+00:00",mind:"l9-triage-drone",model:"qwen3:4b-l9fast",level:"alarm",reasons:["i3 failing: docker","msi failing: dev-mentor","off-box backup 109 h old (alarm > 36 h)"],line:"Critical backups overdue (109h old) and multiple system failures: i3 and msi failing, with insufficient RAM and no green status.",ms:3055},
    {at:"2026-11-08T06:16:16+00:00",mind:"l9-triage-drone",model:"qwen3:4b-l9fast",level:"notable",reasons:["i3 failing: docker"],line:"i3 failing: docker",ms:1794,focus:"i3"},
    {at:"2026-11-08T06:21:04+00:00",mind:"l9-triage-drone",model:"qwen3:4b-l9fast",level:"notable",reasons:["i3 failing: docker"],line:"i3 failing: docker",ms:1711,focus:"i3"},
    {at:"2026-11-08T06:36:20+00:00",mind:"l9-triage-drone",model:"qwen3:4b-l9fast",level:"notable",reasons:["i3 failing: docker"],line:"i3 failing: docker",ms:16578,focus:"i3"}
  ],
  heartbeats: {
    msi:{at:"2026-11-08T06:45:03Z",green:true,ram_avail_mb:5473,checks:[{name:"litellm",ok:true},{name:"dev-mentor",ok:true},{name:"i3-tunnel",ok:true},{name:"docker",ok:true}]},
    i3:{at:"2026-11-08T06:46:42Z",green:false,ram_avail_mb:14786,checks:[{name:"ollama",ok:true},{name:"gameattract",ok:true},{name:"docker",ok:false}]},
    l9:{at:"2026-11-08T06:36:20Z",green:true,checks:[{name:"ollama-mind",ok:true}]}
  }
};
// Rehearsal: clearly labelled demo thoughts that walk every state. Never mixed into real memory.
const REHEARSAL = [
  {mind:"l9-triage-drone",level:"routine",reasons:[],line:"The fleet is quiet. Every rig reporting, nothing failing.",synthetic:true},
  {mind:"culture-ship",level:"notable",reasons:["msi failing: i3-tunnel"],focus:"msi",line:"The workshop has lost its line to the engine room's models.",synthetic:true},
  {mind:"l9-triage-drone",level:"alarm",reasons:["msi heartbeat SILENT 60 min"],focus:"msi",line:"MSI has been silent for an hour.",synthetic:true,silence:"msi"},
  {mind:"i3-engine-mind",level:"notable",reasons:["i3 failing: docker"],focus:"i3",line:"Docker still waits on the BIOS switch. Games play on.",synthetic:true},
  {mind:"culture-ship",level:"routine",reasons:[],line:"All voices back in tune.",synthetic:true}
];
const RIGS = [
  {id:"msi", name:"MSI", role:"workshop", color:"--msi", note:261.63, pos:[0.27,0.40], r:30},
  {id:"i3", name:"i3", role:"engine room", color:"--i3", note:329.63, pos:[0.73,0.36], r:28},
  {id:"l9", name:"L9", role:"drone", color:"--l9", note:392.00, pos:[0.62,0.62], r:20},
  {id:"xanadu", name:"xanadu", role:"librarian", color:"--xanadu", note:493.88, pos:[0.38,0.64], r:24}
];
const MIND_HOME = {"l9-triage-drone":"l9","culture-ship":"msi","i3-engine-mind":"i3"};
const LEVEL = {
  routine:{word:"tranquillo", color:"--tranquillo"},
  notable:{word:"attento", color:"--attento"},
  alarm:{word:"agitato", color:"--agitato"}
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- state ----------
let events = FIXTURE.events.slice(), heartbeats = structuredClone(FIXTURE.heartbeats);
let nowFn = () => FIXTURE_NOW, live = false, rehearsing = false, rehearsalTimer = null;
let current = events[events.length - 1], silenceOverride = null;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- canvas sky ----------
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, stars = [], comets = [], ripples = [];
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({length: Math.round(W * H / 2600)}, () => ({x: Math.random() * W, y: Math.random() * H, z: Math.random(), p: Math.random() * 6.28}));
}
addEventListener("resize", resize); resize();
// On wide screens the sky sits right of the "What needs you" panel (420 px), so no star hides behind it.
const rigXY = id => {
  const r = RIGS.find(q => q.id === id), left = W >= 900 ? 440 : 0;
  return [left + r.pos[0] * (W - left), r.pos[1] * H * (W < 520 ? 0.9 : 1)];
};
const ageMin = hb => hb ? (nowFn() - Date.parse(hb.at)) / 60000 : Infinity;
function rigState(id) {
  if (id === "xanadu") return {silent: false, host: true, checks: []};   // xanadu holds the record itself
  const hb = heartbeats[id];
  const silent = silenceOverride === id || !hb || ageMin(hb) > 15;
  return {silent, hb, age: silenceOverride === id ? 60 : ageMin(hb), checks: hb ? hb.checks : []};
}

let lastDraw = 0;
function frame(t) {
  // Budget (bakeoff rule: <= 5% of one core idle): draw at most 30 fps; browsers pause hidden tabs.
  if (t - lastDraw < 33) { requestAnimationFrame(frame); return; }
  lastDraw = t; drawSky(t); requestAnimationFrame(frame);
}
// ?perf: draw 300 frames back to back (t advancing 33 ms each, as at the 30 fps cap) and report the
// average and p95 cost of one frame in the title and console. Headless browsers starve rAF, so this
// times the draw work itself, which is what the budget is about.
function perfRun() {
  const ms = [], t0 = performance.now();
  for (let i = 0; i < 300; i++) {          // getImageData forces the canvas to actually rasterise each frame
    const a = performance.now(); drawSky(t0 + i * 33); cx.getImageData(0, 0, 1, 1); ms.push(performance.now() - a);
  }
  const s = ms.slice().sort((x, y) => x - y), avg = ms.reduce((x, y) => x + y, 0) / ms.length;
  const msg = `perf avg ${avg.toFixed(3)} ms p95 ${s[284].toFixed(3)} ms max ${s[299].toFixed(3)} ms · 300 frames · ${W}x${H}@${DPR}`;
  console.log(msg); document.title = msg;
}
function drawSky(t) {
  const lvl = LEVEL[current?.level || "routine"];
  const tint = css(lvl.color);
  // sky + mood: a soft glow from below, tinted by the current marking
  cx.fillStyle = css("--sky"); cx.fillRect(0, 0, W, H);
  const g = cx.createRadialGradient(W / 2, H * 1.05, 10, W / 2, H * 1.05, Math.max(W, H) * 0.9);
  const pulse = current?.level === "alarm" && !reduced ? 0.10 + 0.06 * Math.sin(t / 380) : 0.09;
  g.addColorStop(0, hexA(tint, pulse)); g.addColorStop(1, "transparent");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  // stars
  for (const s of stars) {
    const a = 0.25 + 0.55 * s.z * (reduced ? 1 : 0.6 + 0.4 * Math.sin(t / 900 + s.p));
    cx.fillStyle = `rgba(233,228,214,${a})`; cx.fillRect(s.x, s.y, s.z > 0.92 ? 1.6 : 1, s.z > 0.92 ? 1.6 : 1);

  {name: "openwebui", tier: "ui", up: false}, {name: "trueform-forge", tier: "optional", up: false}, {name: "culture-ship", tier: "lattice", up: true},
  {name: "redis", tier: "lattice", up: true}, {name: "dispatch", tier: "core", up: true}, {name: "chatdev", tier: "agents", up: true},
  {name: "simulatedverse", tier: "game", up: true}, {name: "gordon", tier: "agents", up: true}, {name: "serena", tier: "tools", up: true},
  {name: "openhands", tier: "agents", up: true}, {name: "studio", tier: "ui", up: true}, {name: "rimapi", tier: "optional", up: true}]};

// ---------- the spine and MSI Claude, drawn around MSI ----------
const SPINE_MOVES = {
  "ollama": "Start Ollama on MSI (tray app), then: curl 127.0.0.1:11434/api/version",
  "model-router": "docker start kilocore-model-router (after Ollama is up)",
  "mempalace-api": "Restart the KiloCore-MempalaceAPI task (Kilo_Core#692 fixes its bind gate)",
  "openwebui": "Optional UI; start it only if you use it (docker extension Open WebUI)",
  "trueform-forge": "Optional; expected down (memory: Spine expected-down set)"
};
const EXPECTED_DOWN = new Set(["trueform-forge", "rimapi", "desktop-ollama"]);
function drawOrbiters(t) {
  const [x, y] = rigXY("msi"), s = extras.spine;
  if (s && s.services) {                                   // one small moon per spine service
    const n = s.services.length, R = 64;
    s.services.forEach((svc, i) => {
      const a = i / n * 6.283 + (reduced ? 0 : t / 60000);
      cx.fillStyle = svc.up ? hexA(css("--tranquillo"), 0.75) : EXPECTED_DOWN.has(svc.name) ? hexA(css("--ink-dim"), 0.5) : css("--agitato");
      cx.beginPath(); cx.arc(x + Math.cos(a) * R, y + Math.sin(a) * R * 0.55, svc.up ? 2.2 : 3, 0, 6.28); cx.fill();
    });
  }
  // MSI Claude: a bright satellite whose glow follows how busy I am (steps in the last 2 minutes)
  const now = live ? nowFn() : Date.parse("2026-11-08T07:15:30Z");   // snapshot layers were captured at 07:15
  const busy = (extras.claude_activity || []).filter(a => now - Date.parse(a.at) < 120000).length;
  const a = reduced ? -0.8 : t / 2400, cxm = x + Math.cos(a) * 44, cym = y + Math.sin(a) * 26;
  const glow = cx.createRadialGradient(cxm, cym, 1, cxm, cym, 10 + busy * 3);
  glow.addColorStop(0, "rgba(255,255,255,0.95)"); glow.addColorStop(1, hexA(css("--msi"), 0));
  cx.fillStyle = glow; cx.beginPath(); cx.arc(cxm, cym, 10 + busy * 3, 0, 6.28); cx.fill();
}
function renderTick() {
  const el = document.getElementById("claude-tick"), acts = (extras.claude_activity || []).slice(-3).reverse();
  el.replaceChildren();
  if (!acts.length) return;
  const h = document.createElement("span"); h.innerHTML = "<b>MSI Claude</b> is working"; el.append(h);
  for (const x of acts) { const s = document.createElement("span"); s.textContent = `${x.tool} · ${x.label} · ${ago(Date.parse(x.at))}`; el.append(s); }
}

// ---------- conversation: the shared cockpit channel ----------
const VOICE = {"claude (msi seat)": "--msi", "claude (i3 seat)": "--i3", "i3-mind": "--i3", "keath (chorus)": "--ink", "keath": "--ink"};
function renderTalk() {
  const all = extras.channel || [], readBy = {};
  for (const r of all.filter(m => m.kind === "read")) for (const at of r.reads || []) (readBy[at] ||= new Set()).add(r.from.replace(/ \(.*\)/, "").replace("claude", "Claude") + " " + (r.from.match(/\((\w+)/)?.[1] || "").toUpperCase());
  const list = document.getElementById("talk-list"), msgs = all.filter(m => m.kind !== "read").slice(-14);
  list.replaceChildren();
  for (const m of msgs) {
    const li = document.createElement("li"); li.className = "msg" + (/mind$/.test(m.from || "") ? " mind" : "");
    li.style.setProperty("--c", `var(${VOICE[m.from] || "--l9"})`);
    li.innerHTML = `<div class="from">${esc(m.from || "?")} <small>→ ${esc(m.to || "all")} · ${esc(ago(Date.parse(m.at)))}</small></div><div class="body">${esc(m.text || "")}</div>${/^keath/.test(m.from || "") ? `<div class="state">${readBy[m.at] ? "✓✓ read by " + esc([...readBy[m.at]].join(", ")) : "✓ delivered to xanadu · not read yet"}</div>` : ""}`;
    list.append(li);
  }
  list.scrollTop = list.scrollHeight;
  document.getElementById("talk-note").textContent = live ? "" : "Snapshot view. Run chorus/mindview_feed.py to talk live.";
  document.getElementById("talk-send").disabled = !live;
}
document.getElementById("talk-form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("talk-text"), to = document.getElementById("talk-to").value, note = document.getElementById("talk-note");
  if (!input.value.trim()) return;
  try {
    const r = await fetch("say", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: input.value, to})});
    const d = await r.json(); if (!d.ok) throw new Error(d.error);
    extras.channel.push(d.message); input.value = ""; renderTalk(); note.textContent = to === "claude" ? "Sent. MSI Claude sees it on your next prompt." : "Sent.";
  } catch (err) { note.textContent = `Not sent: ${err.message || "the feeder isn't running"}. Start chorus/mindview_feed.py.`; }
});
function askClaude(subject) {
  document.getElementById("needs").open = true;
  document.getElementById("talk-to").value = "claude";
  const input = document.getElementById("talk-text"); input.value = `About "${subject}": `; input.focus();
}

// ---------- rig card: click a star ----------
const sky = document.getElementById("sky"), card = document.getElementById("rig-card");
function rigAt(x, y) { return RIGS.find(r => { const [rx, ry] = rigXY(r.id); return Math.hypot(x - rx, y - ry) < r.r + 22; }); }
function openRig(r) {
  const st = rigState(r.id), hb = st.hb, [rx, ry] = rigXY(r.id);
  const said = events.filter(e => e.focus === r.id).slice(-3);
  const rows = [];
  if (r.id === "xanadu") rows.push(`<div class="row">Keeps the record: heartbeats, the Minds' memory, mirrors and the off-box backup.</div>`,
    `<div class="row">backup <b>${esc(extras.backup ? `${extras.backup.set} · ${Math.round(extras.backup.age_h)} h` : "none")}</b> · mirrors <b>${esc(extras.mirror ? `${extras.mirror.repos} repos · ${extras.mirror.age_h} h` : "no receipt")}</b></div>`);
  if (hb) {
    rows.push(`<div class="row">heard <b>${esc(ago(Date.parse(hb.at)))}</b> · RAM free <b>${hb.ram_avail_mb ?? "?"} MB</b></div>`);
    const disks = Object.entries(hb.disks || {}).map(([k, v]) => `${k} ${v.free_gb ?? "?"} GB${v.pct_free != null && v.pct_free < 12 ? " (low)" : ""}`);
    if (disks.length) rows.push(`<div class="row">disks <b>${esc(disks.join(" · "))}</b></div>`);
    for (const c of hb.checks || []) rows.push(`<div class="row ${c.ok ? "" : "bad"}">${c.ok ? "ok  " : "FAIL"} <b>${esc(c.name)}</b> ${esc(String(c.detail || "").slice(0, 110))}</div>`);
  } else if (r.id !== "xanadu") rows.push(`<div class="row bad">No heartbeat yet.</div>`);
  if (r.id === "msi" && extras.spine) rows.push(`<div class="row">spine <b>${extras.spine.up}/${extras.spine.total} up</b> · down: ${esc(extras.spine.services.filter(s => !s.up).map(s => s.name).join(", ") || "none")}</div>`);
  for (const e of said) rows.push(`<div class="row">${esc(hm(e.at))} ${esc(e.mind)}: <span class="said">${esc(e.line)}</span></div>`);
  card.style.setProperty("--c", `var(${r.color})`);
  card.innerHTML = `<h3>${esc(r.name)} <small>${esc(r.role)} · ${st.silent ? "silent" : st.checks.some(c => !c.ok) ? "out of tune" : "in tune"}</small></h3>${rows.join("")}
    <div class="acts"><button type="button" data-a="ask">Ask Claude</button><button type="button" data-a="close">Close</button></div>`;
  card.querySelector('[data-a="ask"]').onclick = () => askClaude(`${r.name}`);
  card.querySelector('[data-a="close"]').onclick = () => { card.hidden = true; };
  card.hidden = false;
  const w = card.offsetWidth, h = card.offsetHeight;
  const right = rx + r.r + 24, left = rx - r.r - 24 - w;          // beside the star, never on it
  const x = right + w + 16 <= innerWidth ? right : left >= 16 ? left : Math.max(16, innerWidth - w - 16);
  card.style.left = `${x}px`;
  card.style.top = `${Math.max(150, Math.min(innerHeight - h - 16, ry - h / 2))}px`;   // below the Claude ticker
  card.dataset.rig = r.id;
}
sky.addEventListener("click", e => { const r = rigAt(e.clientX, e.clientY); if (r) openRig(r); else card.hidden = true; });
sky.addEventListener("mousemove", e => sky.classList.toggle("pointing", !!rigAt(e.clientX, e.clientY)));
addEventListener("keydown", e => { if (e.key === "Escape") card.hidden = true;
  const i = ["1", "2", "3", "4"].indexOf(e.key); if (i >= 0 && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) openRig(RIGS[i]); });

// ---------- Copy brief: every layer as text, in the order you act on it ----------
function buildBrief() {
  const L = [], stamp = new Date(nowFn()).toISOString().slice(0, 16).replace("T", " ") + " UTC";
  L.push(`CHORUS brief · ${live ? "live" : "snapshot"} · ${stamp}`, "");
  const ns = needs();
  L.push(ns.length ? "1. WHAT NEEDS YOU (most urgent first)" : "1. WHAT NEEDS YOU: nothing. The fleet is in tune.");
  ns.forEach((n, i) => {
    L.push(`  ${i + 1}) [${LEVEL[n.level].word}] ${n.what}`, `     ${n.meta || ""}`.trimEnd(), `     why: ${n.why}`, `     next: ${n.move}`, `     owner: ${n.owner}`);
    for (const p of n.list || []) L.push(`       - ${p.repo}#${p.number} ${p.title} ${p.url}`);
  });
  L.push("", "2. RIGS");
  for (const r of RIGS) {
    const st = rigState(r.id), fails = st.checks.filter(c => !c.ok).map(c => c.name);
    L.push(`  ${r.name} (${r.role}): ${st.silent ? "SILENT" : fails.length ? "failing " + fails.join(", ") : "in tune"}${st.hb ? ` · heard ${ago(Date.parse(st.hb.at))}` : ""}`);
  }
  L.push("", "3. WHAT THE MINDS SAID (latest last)");
  for (const e of events.slice(-5)) L.push(`  ${hm(e.at)} ${e.mind} [${e.level}]: ${e.line}  (reasons: ${(e.reasons || []).join("; ") || "none"})`);
  L.push("", "4. CONVERSATION (latest last)");
  for (const m of (extras.channel || []).slice(-8)) L.push(`  ${hm(m.at)} ${m.from} -> ${m.to}: ${m.text}`);
  const sp = extras.spine;
  if (sp) L.push("", `5. SPINE ${sp.up}/${sp.total} up`, `  down: ${sp.services.filter(x => !x.up).map(x => x.name + (EXPECTED_DOWN.has(x.name) ? " (expected)" : "")).join(", ") || "none"}`);
  return L.join("\n");
}
const copyBtn = document.getElementById("copy-brief");
function copyBrief() {
  const text = buildBrief();
  navigator.clipboard?.writeText(text).then(() => { copyBtn.textContent = "Copied"; setTimeout(() => copyBtn.textContent = "Copy brief", 1500); },
    () => { const w = window.open("", "_blank"); if (w) { w.document.title = "CHORUS brief"; const pre = w.document.createElement("pre"); pre.textContent = text; w.document.body.append(pre); } });
}
copyBtn.onclick = copyBrief;
addEventListener("keydown", e => { if ((e.key === "c" || e.key === "C") && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) copyBrief(); });

drawRiver(); renderNeeds(); renderTalk(); renderTick(); show(current, false); requestAnimationFrame(frame);
if (/[?&]perf(=|&|$)/.test(location.search)) perfRun();
// deep link: index.html#rig=i3 opens that rig's card (after first layout)
const deep = /rig=(\w+)/.exec(location.hash); if (deep) requestAnimationFrame(() => { const r = RIGS.find(x => x.id === deep[1]); if (r) openRig(r); });
</script>
