# GSV build contract for GSV_Godot_Cockpit.
# Headless editor quit alone is not a parse proof; import + explicit GDScript parse gate are required.
schema: gsv.build/v1
project:
  id: gsv-godot-cockpit
  type: godot
  repo: GSV-Sublime-Optimization/GSV_Godot_Cockpit
toolchains:
  godot: "4.7"
  python: "3"
commands:
  check:
    - name: Godot resource import
      run: ${godot} --headless --audio-driver Dummy --path . --import
      requires: [godot]
    - name: Godot GDScript parse
      run: ${python} ${gsv_tools}/godot_parse_gate.py --project . --godot ${godot}
      requires: [godot]
    - name: Self-contained first-party Godot GDScript parse gate
      run: ${python} tests/cockpit_parse_gate.py --godot ${godot} --project .
      requires: [godot]
    - name: Offline gate negative-control regression tests
      run: ${python} -m unittest discover -s tests -p "test_*.py" -v
    - name: Cockpit offline integration smoke with strict engine diagnostics
      run: ${python} tests/godot_smoke_gate.py --godot ${godot} --project .
      requires: [godot]
security:
  network_required: false
  secrets_required: false
